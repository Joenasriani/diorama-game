/* --- 1. CANVAS DYNAMICS --- */

            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            overflow: hidden;
            background: #000000;
        }
        
        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(50px);
            opacity: 0.6;
            animation: morph 10s infinite alternate ease-in-out;
        }
        .blob:nth-child(1) { top: -10%; left: -10%; width: 50vw; height: 50vw; background: #ff9f43; animation-duration: 12s; }
        .blob:nth-child(2) { bottom: -20%; right: -10%; width: 60vw; height: 60vw; background: #ff5252; animation-duration: 15s; }
        .blob:nth-child(3) { top: 40%; left: 40%; width: 40vw; height: 40vw; background: #ffcccc; opacity: 0.3; animation-duration: 9s; }

        @keyframes morph {
            0% { transform: translate(0, 0) scale(1); border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; }
            50% { transform: translate(20px, -20px) scale(1.1); border-radius: 30% 60% 70% 40% / 50% 60% 30% 60%; }
            100% { transform: translate(-20px, 20px) scale(0.9); border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; }

        function normalizeMapRows(rows) {
            const maxLen = Math.max(...rows.map(r => r.length));
            return rows.map(r => r.padEnd(maxLen, '0'));
        }

        function textToBitmapMap(text, options = {}) {
            const {
                width = 220,
                height = 80,
                font = '700 54px Arial',
                threshold = 10,
                step = 5
            } = options;

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');

            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, width, height);

            ctx.fillStyle = 'white';
            ctx.font = font;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.direction = 'rtl';
            ctx.fillText(text, width / 2, height / 2);

            const imageData = ctx.getImageData(0, 0, width, height).data;

            let minX = width, minY = height, maxX = 0, maxY = 0;
            let found = false;

            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const i = (y * width + x) * 4;
                    if (imageData[i] > threshold) {
                        found = true;
                        if (x < minX) minX = x;
                        if (x > maxX) maxX = x;
                        if (y < minY) minY = y;
                        if (y > maxY) maxY = y;
                    }
                }
            }

            if (!found) return ["111"];

            const rows = [];

            for (let y = minY; y <= maxY; y += step) {
                let row = '';
                for (let x = minX; x <= maxX; x += step) {
                    let hit = 0;
                    for (let yy = 0; yy < step; yy++) {
                        for (let xx = 0; xx < step; xx++) {
                            const px = x + xx;
                            const py = y + yy;
                            if (px >= width || py >= height) continue;
                            const i = (py * width + px) * 4;
                            if (imageData[i] > threshold) hit++;
                        }
                    }
                    row += hit > 4 ? '1' : '0';
                }
                rows.push(row);
            }

            return normalizeMapRows(rows).filter(r => r.includes('1'));
        }

        function makeCityLevel(name, index, total) {
            const compact = name.replace(/\s+/g, '');
            const glyphCount = Array.from(compact).length;
            const wordCount = name.trim().split(/\s+/).length;
            const progress = total > 1 ? (index / (total - 1)) : 0;

            const width = Math.min(560, 190 + glyphCount * 34 + (wordCount - 1) * 78);
            const height = wordCount > 1 ? 120 : 96;
            const fontSize = Math.max(52, Math.min(74, 76 - Math.max(0, glyphCount - 4) * 2 - (wordCount - 1) * 3));
            const scaleBase = 0.58 - Math.max(0, glyphCount - 4) * 0.018 - (wordCount - 1) * 0.055 - progress * 0.055;
            const scale = Number(Math.max(0.30, scaleBase).toFixed(2));
            const zScatter = Math.round(18 + progress * 18);

            return {
                name,
                color: cityPalette[index % cityPalette.length],
                scale,
                zScatter,
                subdivisions: 3,
                source: 'Arabic city name of Lebanon',
                map: textToBitmapMap(name, {
                    width,
                    height,
                    font: `700 ${fontSize}px Arial`,
                    step: 4
                })
            };
        }

        const levels = lebanonCityNames.map((name, index) => makeCityLevel(name, index, lebanonCityNames.length));



        // --- Title Loading Gate ---
        function setMusicLoadingProgress(value) {
            const fill = document.getElementById('music-loading-fill');
            const clamped = Math.max(0, Math.min(100, value));
            if (fill) fill.style.width = clamped.toFixed(1) + '%';
        }

        function revealStartButton() {
            const loadingBox = document.getElementById('music-loading-box');
            const startGate = document.getElementById('start-gate');
            setMusicLoadingProgress(100);
            setTimeout(() => {
                if (loadingBox) {
                    loadingBox.classList.remove('visible');
                    loadingBox.style.display = 'none';
                }
                if (startGate) startGate.classList.add('ready');
            }, 320);
        }

        function beginTitleMusicPreload() {
            const loadingBox = document.getElementById('music-loading-box');
            if (loadingBox) loadingBox.classList.add('visible');

            if (!currentAudio) {
                currentAudio = new Audio("music/Paradigm Shift (Anamorphic Assembly) — S - Female.mp3");
                currentAudio.loop = true;
                currentAudio.preload = 'auto';
                currentAudio.volume = 0.55;
                currentAudio.muted = isMuted;
            }

            let simulatedProgress = 0;
            let revealed = false;
            let progressTimer = null;
            const finish = () => {
                if (revealed) return;
                revealed = true;
                if (progressTimer) clearInterval(progressTimer);
                revealStartButton();
            };

            progressTimer = setInterval(() => {
                simulatedProgress = Math.min(94, simulatedProgress + 4);
                setMusicLoadingProgress(simulatedProgress);
            }, 120);

            currentAudio.addEventListener('canplaythrough', finish, { once: true });
            currentAudio.addEventListener('canplay', () => {
                simulatedProgress = Math.max(simulatedProgress, 86);
                setMusicLoadingProgress(simulatedProgress);
            }, { once: true });
            currentAudio.addEventListener('error', finish, { once: true });

            try { currentAudio.load(); } catch (err) { finish(); }
            setTimeout(finish, 3600);
        }

        function startGameplayLoopOnce() {
            if (!gameStarted) {
                gameStarted = true;
                loadLevel(0);
            }
            if (!animationStarted) {
                animationStarted = true;
                animate();
            }
        }

        function beginGameAfterStart(event) {
            if (event) event.preventDefault();
            if (gameStarted) return;

            initMusic().then((played) => {

                const actionSlot = document.getElementById('title-action-slot');
                const subtitle = document.getElementById('intro-subtitle');
                const startGate = document.getElementById('start-gate');
                const intro = document.getElementById('intro-overlay');
                const ui = document.getElementById('ui');
                const widgets = document.querySelectorAll('.glass-widget');

                if (startGate) startGate.classList.add('hidden');
                if (actionSlot) {
                    actionSlot.style.opacity = '0';
                    actionSlot.style.pointerEvents = 'none';
                    setTimeout(() => { actionSlot.style.display = 'none'; }, 650);
                }
                if (subtitle) subtitle.style.display = 'none';
                if (intro) intro.style.display = 'none';
                if (ui) ui.style.opacity = 1;
                widgets.forEach(w => w.style.opacity = 1);

                startGameplayLoopOnce();
            });
        }

        const startGameButton = document.getElementById('start-game-btn');
        if (startGameButton) {
            startGameButton.addEventListener('pointerup', beginGameAfterStart, { passive: false });
        }

        window.addEventListener('load', () => {
            setTimeout(beginTitleMusicPreload, 8500);
        });
        if (document.readyState === 'complete') {
            setTimeout(beginTitleMusicPreload, 8500);
        }

        function handleInteraction() {
            if (gameStarted && !musicStarted) initMusic();
        }

        window.addEventListener('click', handleInteraction);
        window.addEventListener('touchstart', handleInteraction);
        window.addEventListener('keydown', handleInteraction);

        function onDown(x, y) {
            if(isSolved) return;
            isDragging = true;
            prevPos = { x, y };
        }
        function onUp() { isDragging = false; }
        function onMove(x, y) {
            if(isDragging && !isSolved) {
                const dx = x - prevPos.x;
                const dy = y - prevPos.y;
                puzzleGroup.rotation.y += dx * 0.008;
                puzzleGroup.rotation.x += dy * 0.008;
                prevPos = { x, y };
            }
        }

        // --- 6. ANIMATION LOOP ---
        let solveSequenceTime = 0;
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const dt = clock.getDelta();

            if(isSolved) {
                solveSequenceTime += dt;
                
                // Hide hold text instantly on solve
                document.getElementById('hold-instruction').style.opacity = 0;

                if (solveSequenceTime < 1.0) {
                    const t = solveSequenceTime / 1.0;
                    const ease = 1 - Math.pow(1 - t, 3);
                    
                    puzzleGroup.rotation.set(
                        THREE.MathUtils.lerp(puzzleGroup.rotation.x, 0, 0.1),
                        THREE.MathUtils.lerp(puzzleGroup.rotation.y, 0, 0.1),
                        THREE.MathUtils.lerp(puzzleGroup.rotation.z, 0, 0.1)
                    );
                    
                    puzzleGroup.children.forEach(child => {
                        child.position.z = THREE.MathUtils.lerp(child.position.z, 0, 0.1);
                    });
                    
                    puzzleGroup.position.set(0,0,0);
                    puzzleGroup.scale.setScalar(THREE.MathUtils.lerp(puzzleGroup.scale.x, 1, 0.08));

                    flareMesh.material.opacity = Math.sin(t * Math.PI) * 0.8;
                    flareMesh.scale.setScalar(1 + t * 0.5);
                    
                    currentMaterials.forEach(mat => {
                        if (mat && mat.emissive) {
                            mat.emissive.setHex(0xffffff);
                            mat.emissiveIntensity = ease * 0.8;
                        }
                    });
                } 
                else if (solveSequenceTime < 2.5) {
                    puzzleGroup.rotation.set(0,0,0);
                    flareMesh.material.opacity = THREE.MathUtils.lerp(flareMesh.material.opacity, 0, 0.05);
                    currentMaterials.forEach(mat => {
                        if (mat && mat.emissive) mat.emissiveIntensity = 0.2;
                    });
                }
                else {
                    loadLevel(currentLevel + 1);
                }
                
                document.getElementById('sync-container').style.opacity = 0;

            } else {
                const wrap = (r) => {
                    let a = r % (Math.PI * 2);
                    if (a > Math.PI) a -= Math.PI * 2;
                    if (a < -Math.PI) a += Math.PI * 2;
                    return a;
                }
                if (levelIntroTime < LEVEL_INTRO_DURATION) {
                    levelIntroTime += dt;
                    const introT = Math.min(1, levelIntroTime / LEVEL_INTRO_DURATION);
                    const introEase = 1 - Math.pow(1 - introT, 3);
                    puzzleGroup.scale.setScalar(THREE.MathUtils.lerp(0.82, 1.0, introEase));
                    if (!isDragging) puzzleGroup.rotation.z += Math.sin(introT * Math.PI) * dt * 0.045;
                } else if (puzzleGroup.scale.x !== 1) {
                    puzzleGroup.scale.setScalar(1);
                }

                const rx = wrap(puzzleGroup.rotation.x);
                const ry = wrap(puzzleGroup.rotation.y);
                
                const isAligned = Math.abs(rx) < TOLERANCE && Math.abs(ry) < TOLERANCE;

                if (isAligned) {
                    holdTimer += dt;
                    
                    // Show "Hold Steady..." ABOVE the button ONLY for Levels 1 & 2 (Index 0 and 1)
                    if (currentLevel <= 1) {
                        document.getElementById('hold-instruction').style.opacity = 1;
                    } else {
                        // For Levels 3+, standard behavior (Text inside button changes)
                        document.getElementById('hold-instruction').style.opacity = 0;
                        document.getElementById('object-name').innerText = "Hold Steady...";
                        document.getElementById('object-name').style.color = "#55efc4";
                    }

                    const intensity = (holdTimer / REQUIRED_HOLD) * 0.15;
                    puzzleGroup.position.set(
                        (Math.random() - 0.5) * intensity,
                        (Math.random() - 0.5) * intensity,
                        0
                    );
                    
                    flareMesh.material.opacity = (holdTimer / REQUIRED_HOLD) * 0.4;
                    flareMesh.scale.setScalar(0.8 + (holdTimer / REQUIRED_HOLD) * 0.2);

                    document.getElementById('sync-container').style.opacity = 1;
                    document.getElementById('sync-bar').style.width = `${(holdTimer / REQUIRED_HOLD) * 100}%`;
                    
                    if (holdTimer >= REQUIRED_HOLD) {
                        isSolved = true;
                        document.getElementById('object-name').innerText = levels[currentLevel].name;
                        document.getElementById('object-name').style.opacity = 1;
                        document.getElementById('object-name').style.color = "#fff";
                        
                        const panel = document.querySelector('.gummy-panel');
                        panel.style.transform = "scale(1.05)";
                        setTimeout(() => panel.style.transform = "scale(1)", 200);
                    }
                } else {
                    if (holdTimer > 0) {
                        holdTimer -= dt * 3.0; 
                        if (holdTimer < 0) holdTimer = 0;
                        document.getElementById('sync-bar').style.width = `${(holdTimer / REQUIRED_HOLD) * 100}%`;
                    } else {
                        document.getElementById('sync-container').style.opacity = 0;
                        
                        // Reset text behaviors based on level
                        document.getElementById('hold-instruction').style.opacity = 0;
                        document.getElementById('object-name').innerText = "Find the hidden symbol";
                        document.getElementById('object-name').style.color = "#fff";
                    }
                    
                    flareMesh.material.opacity = 0;
                    puzzleGroup.position.set(0,0,0);
                }
                
                puzzleGroup.rotation.z = THREE.MathUtils.lerp(puzzleGroup.rotation.z, 0, 0.02);
            }

            renderer.render(scene, camera);
        }

        function getPinchDistance(touches) {
            const dx = touches[0].clientX - touches[1].clientX;
            const dy = touches[0].clientY - touches[1].clientY;
            return Math.hypot(dx, dy);
        }

        window.addEventListener('mousedown', e => onDown(e.clientX, e.clientY));
        window.addEventListener('mouseup', onUp);
        window.addEventListener('mousemove', e => onMove(e.clientX, e.clientY));

        window.addEventListener('wheel', e => {
            e.preventDefault();
            const zoomFactor = e.deltaY > 0 ? 0.90 : 1.10;
            setCameraZoom(camera.zoom * zoomFactor);
        }, { passive: false });

        const zoomInBtn = document.getElementById('zoom-in');
        const zoomOutBtn = document.getElementById('zoom-out');
        const zoomResetBtn = document.getElementById('zoom-reset');
        if (zoomInBtn) zoomInBtn.addEventListener('click', () => setCameraZoom(camera.zoom * 1.18));
        if (zoomOutBtn) zoomOutBtn.addEventListener('click', () => setCameraZoom(camera.zoom * 0.82));
        if (zoomResetBtn) zoomResetBtn.addEventListener('click', resetCameraZoomForScreen);
        updateZoomButtons();

        window.addEventListener('touchstart', e => {
            if (e.touches.length === 2) {
                e.preventDefault();
                isDragging = false;
                lastPinchDistance = getPinchDistance(e.touches);
            } else if (e.touches.length === 1) {
                onDown(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: false });

        window.addEventListener('touchend', e => {
            if (e.touches.length < 2) lastPinchDistance = 0;
            if (e.touches.length === 0) onUp();
        }, { passive: false });

        window.addEventListener('touchmove', e => {
            e.preventDefault();
            if (e.touches.length === 2) {
                const dist = getPinchDistance(e.touches);
                if (lastPinchDistance > 0) setCameraZoom(camera.zoom * (dist / lastPinchDistance));
                lastPinchDistance = dist;
                return;
            }
            if (e.touches.length === 1) onMove(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: false });

        window.addEventListener('resize', () => {
            const aspect = window.innerWidth / window.innerHeight;
            camera.left = -d * aspect;
            camera.right = d * aspect;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            updateZoomButtons();
        });
        // Game level and animation start only after the Start button is pressed.
</script>
</body>
</html>
