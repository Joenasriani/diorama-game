<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DIORAMA</title>
  <style>
    @font-face {
      font-family: "Amatic SC";
      src: url("./assets/fonts/AmaticSC-Regular.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    :root {
      color-scheme: dark;
      --ink: #221a13;
      --paper: #f3dfb4;
      --paper-soft: #d7b879;
      --edge: #7f6237;
      --shadow: rgba(0, 0, 0, 0.42);
      --deep: #10130f;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      font-family: "Amatic SC", "Trebuchet MS", Arial, sans-serif;
      background:
        radial-gradient(circle at 50% 24%, rgba(243, 223, 180, 0.16), transparent 32rem),
        linear-gradient(145deg, #161b14 0%, #0b0d0a 48%, #17110b 100%);
      color: var(--paper);
      overflow: hidden;
    }

    main {
      position: relative;
      display: grid;
      min-height: 100vh;
      min-height: 100dvh;
      place-items: center;
      padding: max(24px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
      isolation: isolate;
    }

    .stage {
      position: absolute;
      inset: auto 0 7vh;
      height: min(36vh, 270px);
      transform: skewY(-7deg) scaleY(0.72);
      background:
        linear-gradient(90deg, transparent, rgba(243, 223, 180, 0.07), transparent),
        repeating-linear-gradient(90deg, rgba(243, 223, 180, 0.09) 0 1px, transparent 1px 62px),
        repeating-linear-gradient(0deg, rgba(243, 223, 180, 0.07) 0 1px, transparent 1px 44px);
      opacity: 0.8;
      filter: drop-shadow(0 -22px 28px rgba(0, 0, 0, 0.2));
      z-index: -2;
    }

    .stage::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 38%;
      width: min(66vw, 520px);
      height: 28px;
      transform: translateX(-50%);
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.44);
      filter: blur(18px);
    }

    .robot {
      position: absolute;
      left: calc(50% - 26px);
      bottom: calc(7vh + 78px);
      width: 52px;
      height: 78px;
      z-index: -1;
      filter: drop-shadow(0 26px 22px rgba(0, 0, 0, 0.46));
    }

    .robot::before,
    .robot::after {
      content: "";
      position: absolute;
      inset: 0;
      border: 3px solid var(--paper-soft);
      border-radius: 16px 16px 10px 10px;
      background: linear-gradient(#e5c98b, #b68b45);
    }

    .robot::after {
      left: 15px;
      top: -18px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border-color: #e08b35;
      background: #f29a34;
      box-shadow: 0 31px 0 -8px var(--ink), 0 49px 0 -8px var(--ink);
    }

    .title {
      display: grid;
      gap: 0.7rem;
      justify-items: center;
      text-align: center;
      transform: translateY(-3vh);
    }

    h1 {
      margin: 0;
      font-size: clamp(5.2rem, 17vw, 12rem);
      font-weight: 400;
      line-height: 0.82;
      letter-spacing: 0;
      text-shadow: 0 8px 0 var(--shadow), 0 22px 46px rgba(0, 0, 0, 0.5);
    }

    p {
      max-width: 42rem;
      margin: 0;
      color: rgba(243, 223, 180, 0.78);
      font: 400 clamp(1.45rem, 4.4vw, 2.35rem) / 1.08 "Amatic SC", "Trebuchet MS", Arial, sans-serif;
    }

    .font-check {
      position: fixed;
      right: 12px;
      bottom: 10px;
      color: rgba(243, 223, 180, 0.45);
      font: 400 1.35rem/1 "Amatic SC", "Trebuchet MS", Arial, sans-serif;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <main aria-label="DIORAMA game start screen">
    <div class="stage" aria-hidden="true"></div>
    <div class="robot" aria-hidden="true"></div>
    <section class="title">
      <h1>DIORAMA</h1>
      <p>The local game font is now loaded from the repository, using the GitHub Pages-safe path.</p>
    </section>
  </main>
  <div class="font-check" id="font-check">font loading...</div>
  <script>
    const check = document.getElementById("font-check");

    if (document.fonts && document.fonts.load) {
      document.fonts.load("2rem Amatic SC").then(() => {
        check.textContent = "Amatic SC loaded";
      }).catch(() => {
        check.textContent = "font fallback active";
      });
    } else {
      check.textContent = "font fallback active";
    }
  </script>
</body>
</html>
