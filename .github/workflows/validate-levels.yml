name: Validate DIORAMA level data
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  level-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate embedded level definitions
        run: node scripts/validate-levels.cjs
