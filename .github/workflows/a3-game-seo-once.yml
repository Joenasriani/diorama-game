name: Canonical game metadata alignment

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/a3-game-seo-once.yml

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          title='DIORAMA | Joe Nasr'
          name='DIORAMA'
          description='DIORAMA is Joe Nasr’s isometric route puzzle built around compact spatial scenes, path logic and tactile 3D interaction.'
          canonical='https://joenasr.itch.io/diorama'
          repo='https://github.com/Joenasriani/diorama-game'
          person='https://joe-nasr-signals.vercel.app/v2/#joe-nasr'
          if re.search(r'<title\b[^>]*>.*?</title>',s,flags=re.I|re.S): s=re.sub(r'<title\b[^>]*>.*?</title>',f'<title>{title}</title>',s,count=1,flags=re.I|re.S)
          else: s=re.sub(r'<head\b[^>]*>',lambda m:m.group(0)+'\n<title>'+title+'</title>',s,count=1,flags=re.I)
          start='<!-- A3: Joe Nasr canonical game metadata -->'; end='<!-- /A3: Joe Nasr canonical game metadata -->'
          if start in s and end in s: s=s[:s.index(start)]+s[s.index(end)+len(end):]
          block=f'''{start}
<meta name="description" content="{description}">
<meta name="author" content="Joe Nasr">
<meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1">
<link rel="canonical" href="{canonical}">
<meta property="og:type" content="website">
<meta property="og:title" content="{title}">
<meta property="og:description" content="{description}">
<meta property="og:url" content="{canonical}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{title}">
<meta name="twitter:description" content="{description}">
<script type="application/ld+json">{{"@context":"https://schema.org","@type":"VideoGame","@id":"{canonical}#game","name":"{name}","url":"{canonical}","description":"{description}","genre":"Puzzle","gamePlatform":"Web browser","inLanguage":"en","creator":{{"@type":"Person","@id":"{person}","name":"Joe Nasr","alternateName":["Joe Ribal Nasr","Joseph Ribal Nasr"],"url":"https://joe-nasr-signals.vercel.app/v2/"}},"sameAs":["{repo}"]}}</script>
{end}'''
          m=re.search(r'</head>',s,flags=re.I)
          if not m: raise SystemExit('No closing head tag found')
          s=s[:m.start()]+block+'\n'+s[m.start():]
          p.write_text(s,encoding='utf-8')
          PY
          rm -f .github/workflows/a3-game-seo-once.yml
          git config user.name "Joe Nasr repository maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/a3-game-seo-once.yml
          git diff --cached --quiet || git commit -m "Align game metadata with canonical Joe Nasr identity"
          git push
